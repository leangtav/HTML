<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <nav>
        <a href="../index.html">about</a>
        <a href="work.html">project/work</a>
        <a href="resume.html">resume</a>
        <a href="contact.html">contact</a>
    </nav>

    <header>
        <h1>Contact Me</h1>
    </header>

    <main>
        <section id="contact" class="container">
            <h2>Get in Touch</h2>
            <p>Feel free to reach out to me using the form below, or via the contact details provided.</p>

            <form action="mailto:landphalll@gmail.com" enctype="text/plain" method="post">
                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <br>
                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <br>
                <div class="form-group">
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" placeholder="+123456789">
                </div>
                <br>
                <div class="form-group">
                    <label for="company">Company / Organization:</label>
                    <input type="text" id="company" name="company">
                </div>
                <br>
                <div class="form-group">
                    <label for="subject">Subject:</label>
                    <input type="text" id="subject" name="subject">
                </div>
                <br>
                <div class="form-group">
                    <label for="reason">Reason for Contact:</label>
                    <select id="reason" name="reason">
                        <option value="">-- Select an Option --</option>
                        <option value="job">Job Opportunity</option>
                        <option value="project">Project Inquiry</option>
                        <option value="collaboration">Collaboration</option>
                        <option value="general">General Inquiry</option>
                    </select>
                </div>
                <br>
                <div class="form-group">
                    <label for="message">Your Message:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <br>
                <div class="checkbox">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Subscribe to my newsletter</label>
                </div>
                <br>
                <button type="submit">Send Message</button>
            </form>
        </section>

        <section class="contact-info">
            <p>Email: <a href="mailto:landphalll@gmail.com">landphalll@gmail.com</a></p>
            <p>Phone: +855 962657233</p>
            <div class="social-links">
                <a href="https://github.com/lanhphalla030907">GitHub</a> |
                <a href="https://www.linkedin.com/in/land-phalll-452954425/?isSelfProfile=true">LinkedIn</a>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 My Portfolio</p>
    </footer>
</body>
</html>
